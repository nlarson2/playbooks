---
- name: Add Neovim apt repo
  become: true
  ansible.builtin.apt_repository:
    repo: ppa:neovim-ppa/unstable
    state: present
    update_cashe: false

- name: Udpate apt packages
  become: true
  ansible.builtin.apt:
    update_cache: true
 
- name: Install Neovim
  become: true
  ansible.builtin.apt:
    name: neovim
    state: present
