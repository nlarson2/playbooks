- name: Remove Neovim PPA
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/neovim-ppa.gpg] https://ppa.launchpadcontent.net/neovim-ppa/stable/ubuntu {{ ansible_facts['distribution_release'] }} main"
    filename: neovim-ppa
    state: absent
    update_cache: false

- name: Update apt packages
  become: true
  ansible.builtin.apt:
    update_cache: true

- name: Install Neovim
  become: true
  ansible.builtin.apt:
    name: neovim
    state: present
